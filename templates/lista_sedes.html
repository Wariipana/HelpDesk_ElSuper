<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Lista de Sedes - ElSuper HelpDesk</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% include '_sidebar.html' %}
  <div class="main-content">
    <div class="header-list">
      <h1>Sedes</h1>
      <a href="{{ url_for('form_sede') }}" class="btn-nuevo">+ Nueva Sede</a>
    </div>

    <div class="tabla-contenedor">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Direccion</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          {% if sedes %}
            {% for sede in sedes %}
            <tr>
              <td>{{ sede['id'] }}</td>
              <td>{{ sede['nombre'] }}</td>
              <td>{{ sede['direccion'] }}</td>
              <td>
                <a href="{{ url_for('cargar_formulario_editar_sede', id_sede=sede['id']) }}" class="btn-editar">Editar</a>
                <a href="#"
                   class="btn-eliminar"
                   onclick="mostrarModalConfirmar('¿Seguro que deseas eliminar la sede {{ sede.nombre }}?', '{{ url_for("eliminar_sede_view", id_sede=sede.id) }}'); return false;">
                  Eliminar
                </a>
              </td>
            </tr>
            {% endfor %}
          {% else %}
            <tr><td colspan="4" class="sin-registros">No existen registros</td></tr>
          {% endif %}
        </tbody>
      </table>
    </div>
  </div>

  <div id="modal-confirmar" class="modal-overlay modal-oculto">
    <div class="modal-caja">
      <h3>Confirmar eliminacion</h3>
      <p id="modal-confirmar-texto"></p>
      <div class="modal-botones">
        <button class="btn-cancelar" onclick="cerrarModalConfirmar()">Cancelar</button>
        <a id="modal-confirmar-btn" href="#" class="btn-accion">Eliminar</a>
      </div>
    </div>
  </div>

  <script src="/static/validaciones.js"></script>
</body>
</html>
