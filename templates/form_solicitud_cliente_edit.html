<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editar Solicitud de Cliente - ElSuper HelpDesk</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% include '_sidebar.html' %}
  <div class="main-content">
    <h1>Editar Solicitud de Cliente</h1>
    <form action="/actualizar-solicitud-cliente" method="post">
      <input type="hidden" name="id" value="{{ solicitud['id'] }}">

      <label for="nombre_cliente">Nombre del cliente:</label><br>
      <input type="text" id="nombre_cliente" name="nombre_cliente" value="{{ solicitud['nombre_cliente'] }}" required><br>

      <label for="apellido_cliente">Apellido del cliente:</label><br>
      <input type="text" id="apellido_cliente" name="apellido_cliente" value="{{ solicitud['apellido_cliente'] }}" required><br>

      <label for="tipo_documento">Tipo de documento:</label><br>
      <select id="tipo_documento" name="tipo_documento" required>
        <option value="dni" {% if solicitud['tipo_documento'] == 'dni' %}selected{% endif %}>DNI</option>
        <option value="ce" {% if solicitud['tipo_documento'] == 'ce' %}selected{% endif %}>CE</option>
        <option value="pasaporte" {% if solicitud['tipo_documento'] == 'pasaporte' %}selected{% endif %}>Pasaporte</option>
        <option value="ruc" {% if solicitud['tipo_documento'] == 'ruc' %}selected{% endif %}>RUC</option>
        <option value="ptp" {% if solicitud['tipo_documento'] == 'ptp' %}selected{% endif %}>PTP</option>
        <option value="otro" {% if solicitud['tipo_documento'] == 'otro' %}selected{% endif %}>Otro</option>
      </select><br>

      <label for="numero_documento">Numero de documento:</label><br>
      <input type="text" id="numero_documento" name="numero_documento" value="{{ solicitud['numero_documento'] }}" required><br>

      <label for="telefono_cliente">Telefono del cliente:</label><br>
      <input type="text" id="telefono_cliente" name="telefono_cliente" value="{{ solicitud['telefono_cliente'] }}"><br>

      <label for="email_cliente">Email del cliente:</label><br>
      <input type="email" id="email_cliente" name="email_cliente" value="{{ solicitud['email_cliente'] }}"><br>

      <label for="tipo">Tipo de solicitud:</label><br>
      <select id="tipo" name="tipo" required>
        <option value="alta" {% if solicitud['tipo'] == 'alta' %}selected{% endif %}>Alta</option>
        <option value="baja" {% if solicitud['tipo'] == 'baja' %}selected{% endif %}>Baja</option>
      </select><br>

      <label for="motivo">Motivo:</label><br>
      <textarea id="motivo" name="motivo" rows="4" required>{{ solicitud['motivo'] }}</textarea><br>

      <label for="sede_id">ID de sede:</label><br>
      <input type="number" id="sede_id" name="sede_id" value="{{ solicitud['sede_id'] }}" required><br>

      <label for="solicitado_por">ID de usuario que solicita:</label><br>
      <input type="number" id="solicitado_por" name="solicitado_por" value="{{ solicitud['solicitado_por'] }}" required><br>

      <input type="submit" value="Guardar Cambios">
    </form>
  </div>
</body>
</html>
