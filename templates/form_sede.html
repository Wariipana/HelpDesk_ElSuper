<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Sede - ElSuper HelpDesk</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% include '_sidebar.html' %}
  <div class="main-content">
    <h1>Registrar Sede</h1>
    <form id="form-sede" action="/guardar-sede" method="post">
      <label for="nombre">Nombre:</label><br>
      <input type="text" id="nombre" name="nombre" data-validar="requerido"><br>
      <span class="campo-error"></span>

      <label for="direccion">Dirección:</label><br>
      <input type="text" id="direccion" name="direccion" data-validar="requerido"><br>
      <span class="campo-error"></span>

      <input type="submit" value="Registrar">
    </form>
  </div>

  <div id="modal-error" class="modal-overlay modal-oculto">
    <div class="modal-caja">
      <h3>No se pudo proceder</h3>
      <ul id="modal-lista-errores"></ul>
      <a href="javascript:void(0)" class="btn-accion" onclick="cerrarModal()">Cerrar</a>
    </div>
  </div>

  <div id="modal-guardar" class="modal-overlay modal-oculto">
    <div class="modal-caja">
      <h3>Confirmar guardado</h3>
      <p id="modal-guardar-texto"></p>
      <div class="modal-botones">
        <button class="btn-cancelar" onclick="cerrarModalGuardar()">Cancelar</button>
        <button class="btn-accion" onclick="confirmarGuardar()">Guardar</button>
      </div>
    </div>
  </div>

  <script src="/static/validaciones.js"></script>
  <script>configurarFormulario('form-sede', '¿Está seguro que desea guardar la sede?');</script>
</body>
</html>
