<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Solicitud de Cliente - ElSuper HelpDesk</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% include '_sidebar.html' %}
  <div class="main-content">
    <h1>Registrar Solicitud de Cliente</h1>
    <form id="form-solicitud-cliente" action="/guardar-solicitud-cliente" method="post">

      <label for="nombre_cliente">Nombre del cliente:</label><br>
      <input type="text" id="nombre_cliente" name="nombre_cliente" data-validar="requerido"><br>
      <span class="campo-error"></span>

      <label for="apellido_cliente">Apellido del cliente:</label><br>
      <input type="text" id="apellido_cliente" name="apellido_cliente" data-validar="requerido"><br>
      <span class="campo-error"></span>

      <label for="tipo_documento">Tipo de documento:</label><br>
      <select id="tipo_documento" name="tipo_documento" data-validar="requerido">
        <option value="dni">DNI</option>
        <option value="ce">CE</option>
        <option value="pasaporte">Pasaporte</option>
        <option value="ruc">RUC</option>
        <option value="ptp">PTP</option>
        <option value="otro">Otro</option>
      </select><br>
      <span class="campo-error"></span>

      <label for="numero_documento">Numero de documento:</label><br>
      <input type="text" id="numero_documento" name="numero_documento" data-validar="documento"><br>
      <span class="campo-error"></span>

      <label for="telefono_cliente">Telefono del cliente:</label><br>
      <input type="text" id="telefono_cliente" name="telefono_cliente" data-validar="telefono"><br>
      <span class="campo-error"></span>

      <label for="email_cliente">Email del cliente:</label><br>
      <input type="email" id="email_cliente" name="email_cliente" data-validar="requerido"><br>
      <span class="campo-error"></span>

      <label for="tipo">Tipo de solicitud:</label><br>
      <select id="tipo" name="tipo" data-validar="requerido">
        <option value="alta">Alta</option>
        <option value="baja">Baja</option>
      </select><br>
      <span class="campo-error"></span>

      <label for="motivo">Motivo:</label><br>
      <textarea id="motivo" name="motivo" rows="4" data-validar="requerido"></textarea><br>
      <span class="campo-error"></span>

      <div class="campo-sesion">
        <span class="campo-sesion-label">Sede</span>
        <span class="campo-sesion-valor">
          <span class="material-symbols-outlined">location_on</span>
          {{ session.get('usuario_sede') or '—' }}
        </span>
      </div>

      <div class="campo-sesion">
        <span class="campo-sesion-label">Registrado por</span>
        <span class="campo-sesion-valor">
          <span class="material-symbols-outlined">account_circle</span>
          {{ session.get('usuario_nombre') or '—' }}
        </span>
      </div>

      <input type="submit" value="Registrar">
    </form>
  </div>

  <div id="modal-error" class="modal-overlay modal-oculto">
    <div class="modal-caja">
      <h3>No se pudo proceder</h3>
      <ul id="modal-lista-errores"></ul>
      <a href="javascript:void(0)" class="btn-accion" onclick="cerrarModal()">Cerrar</a>
    </div>
  </div>

  <div id="modal-guardar" class="modal-overlay modal-oculto">
    <div class="modal-caja">
      <h3>Confirmar guardado</h3>
      <p id="modal-guardar-texto"></p>
      <div class="modal-botones">
        <button class="btn-cancelar" onclick="cerrarModalGuardar()">Cancelar</button>
        <button class="btn-accion" onclick="confirmarGuardar()">Guardar</button>
      </div>
    </div>
  </div>

  <script src="/static/validaciones.js"></script>
  <script>configurarFormulario('form-solicitud-cliente', '¿Esta seguro que desea registrar la solicitud?');</script>
</body>
</html>
