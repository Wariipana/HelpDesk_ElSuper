<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar Ticket - ElSuper HelpDesk</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% include '_sidebar.html' %}
  <div class="main-content">
    <h1>Registrar Ticket</h1>
    <form id="form-ticket" action="/guardar-ticket" method="post">

      <label for="titulo">Titulo:</label><br>
      <input type="text" id="titulo" name="titulo" data-validar="requerido"><br>
      <span class="campo-error"></span>

      <label for="descripcion">Descripcion:</label><br>
      <textarea id="descripcion" name="descripcion" rows="4" data-validar="requerido"></textarea><br>
      <span class="campo-error"></span>

      <label for="categoria">Categoria:</label><br>
      <select id="categoria" name="categoria" data-validar="requerido">
        <option value="hardware">Hardware</option>
        <option value="software">Software</option>
        <option value="conectividad">Conectividad</option>
        <option value="otro">Otro</option>
      </select><br>
      <span class="campo-error"></span>

      <label for="prioridad">Prioridad:</label><br>
      <select id="prioridad" name="prioridad" data-validar="requerido">
        <option value="baja">Baja</option>
        <option value="media" selected>Media</option>
        <option value="alta">Alta</option>
        <option value="critica">Critica</option>
      </select><br>
      <span class="campo-error"></span>

      <label for="equipo_afectado">Equipo afectado:</label><br>
      <input type="text" id="equipo_afectado" name="equipo_afectado" data-validar="requerido"><br>
      <span class="campo-error"></span>

      <label for="cantidad_equipos">Cantidad de equipos:</label><br>
      <input type="number" id="cantidad_equipos" name="cantidad_equipos" value="1" min="1" data-validar="entero-positivo"><br>
      <span class="campo-error"></span>

      <label for="nombre_contacto">Nombre de contacto:</label><br>
      <input type="text" id="nombre_contacto" name="nombre_contacto" data-validar="requerido"><br>
      <span class="campo-error"></span>

      <label for="telefono_contacto">Telefono de contacto:</label><br>
      <input type="text" id="telefono_contacto" name="telefono_contacto" data-validar="telefono"><br>
      <span class="campo-error"></span>

      <div class="campo-sesion">
        <span class="campo-sesion-label">Sede</span>
        <span class="campo-sesion-valor">
          <span class="material-symbols-outlined">location_on</span>
          {{ session.get('usuario_sede') or '—' }}
        </span>
      </div>

      <div class="campo-sesion">
        <span class="campo-sesion-label">Registrado por</span>
        <span class="campo-sesion-valor">
          <span class="material-symbols-outlined">account_circle</span>
          {{ session.get('usuario_nombre') or '—' }}
        </span>
      </div>

      <input type="submit" value="Registrar">
    </form>
  </div>

  <div id="modal-error" class="modal-overlay modal-oculto">
    <div class="modal-caja">
      <h3>No se pudo proceder</h3>
      <ul id="modal-lista-errores"></ul>
      <a href="javascript:void(0)" class="btn-accion" onclick="cerrarModal()">Cerrar</a>
    </div>
  </div>

  <div id="modal-guardar" class="modal-overlay modal-oculto">
    <div class="modal-caja">
      <h3>Confirmar guardado</h3>
      <p id="modal-guardar-texto"></p>
      <div class="modal-botones">
        <button class="btn-cancelar" onclick="cerrarModalGuardar()">Cancelar</button>
        <button class="btn-accion" onclick="confirmarGuardar()">Guardar</button>
      </div>
    </div>
  </div>

  <script src="/static/validaciones.js"></script>
  <script>configurarFormulario('form-ticket', '¿Esta seguro que desea registrar el ticket?');</script>
</body>
</html>
